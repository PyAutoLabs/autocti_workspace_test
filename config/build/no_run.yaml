# Scripts to skip during automated runs (smoke tests, pre-release checks, CI).
# Each entry is matched against script paths:
#   - Entries with '/' do a substring match against the file path
#   - Entries without '/' match the file stem exactly
# Add an inline # comment to document the reason for skipping.
#
# THIS LIST IS REPO-LOCAL. Every entry must match a file in THIS repo; a
# pattern that matches nothing is silently inert, not a skip.
#
# SLOW-skip convention:
#   Entries tagged `# SLOW <YYYY-MM-DD> - <reason>` mark scripts skipped
#   because they exceed the per-script timeout cap. These are NOT permanent
#   skips — fix the performance issue and remove the SLOW marker.
#
# NEEDS_FIX convention:
#   Entries tagged `# NEEDS_FIX <YYYY-MM-DD> - <reason>` mark scripts that are
#   broken and parked as a to-do list. NOT permanent — investigate, fix the
#   underlying bug, and remove the NEEDS_FIX marker.
#
# No entries yet: every script in scripts/ runs green under both profiles
# (cti-upkeep 3b, autocti_workspace_test#26).
